seed: 0

data:
  root: ~/data/imagenet100
  train_dir: train
  val_dir: val
  num_classes: 100
  input_size: 224
  batch_size: 128
  num_workers: 0
  pin_memory: false
  augment: true
  paper_crop: true
  pca_lighting: true
  ten_crop: false

model:
  dropout: 0.5
  activation: relu
  use_lrn: true
  init: paper
  # Caffe divides alpha by the window size (n=5); PyTorch does not.
  lrn_alpha: 0.00002

train:
  epochs: 90
  optimizer: sgd
  # 0.01 does not train with Caffe-scale inputs here; 0.003 is the tested value.
  lr: 0.003
  momentum: 0.9
  weight_decay: 0.0005
  scheduler: plateau
  lr_patience: 3
  min_lr: 0.00001
  amp: false
  label_smoothing: 0.0
  grad_clip: 0.0
  limit_batches: null

output:
  dir: runs/paper_baseline
